<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساحتي الذكية - خصص يومك</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 15px;
            border-bottom: 3px solid var(--accent);
        }

        header h1 {
            color: var(--accent);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .top-bar {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
        }

        .save-badge {
            font-size: 0.9rem;
            color: var(--success);
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .card-header h2 {
            color: var(--accent);
            font-size: 1.25rem;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 9px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
        }

        button:hover {
            background-color: var(--accent-hover);
            color: white;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            padding: 4px 9px;
            font-size: 0.8rem;
        }

        .btn-add-widget {
            background-color: var(--success);
            color: #0f172a;
        }

        /* قائمة المهام */
        .input-group {
            display: flex;
            gap: 8px;
        }
        .input-group input { margin-bottom: 0; }
        ul { list-style: none; margin-top: 12px; }
        li {
            background: #0f172a;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li.completed span {
            text-decoration: line-through;
            color: #64748b;
        }

        /* المؤقت */
        .timer-display {
            font-size: 3.2rem;
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
            color: var(--success);
            font-variant-numeric: tabular-nums;
        }
        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* الروابط المخصصة */
        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .link-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .link-box a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: bold;
            flex: 1;
        }
        .link-box a:hover { color: var(--accent); }

        /* الآلة الحاسبة */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .calc-grid button {
            padding: 12px;
            font-size: 1.1rem;
            background-color: #334155;
            color: white;
        }
        .calc-grid button.op { background-color: var(--accent); color: #0f172a; }
        .calc-grid button.clear { background-color: var(--danger); }
    </style>
</head>
<body>

    <header>
        <h1>مساحتي الذكية 🚀</h1>
        <p id="date-display"></p>
    </header>

    <!-- شريط التحكم العلوي -->
    <div class="top-bar">
        <span class="save-badge" id="save-status">● جميع بياناتك محفوظة تلقائياً على جهازك</span>
        <button class="btn-add-widget" onclick="createCustomWidget()">+ أضف بطاقة / قسم خاص بيك</button>
    </div>

    <div class="container" id="main-grid">
        
        <!-- 1. قائمة المهام -->
        <div class="card">
            <div class="card-header"><h2>✅ مهام اليوم</h2></div>
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="اكتب مهمة جديدة...">
                <button onclick="addTodo()">إضافة</button>
            </div>
            <ul id="todo-list"></ul>
        </div>

        <!-- 2. المؤقت -->
        <div class="card">
            <div class="card-header"><h2>⏱️ مؤقت التركيز</h2></div>
            <div class="timer-display" id="timer">25:00</div>
            <div class="timer-controls">
                <button onclick="startTimer()">ابدأ</button>
                <button onclick="pauseTimer()" style="background:#eab308;">إيقاف</button>
                <button onclick="resetTimer()" style="background:#64748b; color:white;">إعادة</button>
            </div>
        </div>

        <!-- 3. المفكرة التلقائية -->
        <div class="card">
            <div class="card-header"><h2>📝 مفكرة سريعة</h2></div>
            <textarea id="quick-notes" rows="8" placeholder="اكتب أي ملاحظة هنا وهتتحفظ تلقائياً..."></textarea>
        </div>

        <!-- 4. روابطك الخاصة -->
        <div class="card">
            <div class="card-header"><h2>🔗 مواقعي المفضلة</h2></div>
            <input type="text" id="link-name" placeholder="اسم الموقع (مثلاً: يوتيوب)">
            <div class="input-group">
                <input type="url" id="link-url" placeholder="الرابط (https://...)">
                <button onclick="addCustomLink()">إضافة</button>
            </div>
            <div class="links-grid" id="links-container"></div>
        </div>

        <!-- 5. الآلة الحاسبة -->
        <div class="card">
            <div class="card-header"><h2>🧮 آلة حاسبة</h2></div>
            <input type="text" id="calc-display" readonly style="text-align: left; font-size: 1.4rem;">
            <div class="calc-grid">
                <button onclick="appendCalc('7')">7</button>
                <button onclick="appendCalc('8')">8</button>
                <button onclick="appendCalc('9')">9</button>
                <button class="op" onclick="appendCalc('/')">÷</button>
                <button onclick="appendCalc('4')">4</button>
                <button onclick="appendCalc('5')">5</button>
                <button onclick="appendCalc('6')">6</button>
                <button class="op" onclick="appendCalc('*')">×</button>
                <button onclick="appendCalc('1')">1</button>
                <button onclick="appendCalc('2')">2</button>
                <button onclick="appendCalc('3')">3</button>
                <button class="op" onclick="appendCalc('-')">-</button>
                <button class="clear" onclick="clearCalc()">C</button>
                <button onclick="appendCalc('0')">0</button>
                <button class="op" onclick="calculate()">=</button>
                <button class="op" onclick="appendCalc('+')">+</button>
            </div>
        </div>

        <!-- هنا هتظهر البطاقات المخصصة اللي المستخدم بيضيفها -->
    </div>

    <script>
        // دالة إظهار إشعار الحفظ التلقائي
        function showSavedStatus() {
            const status = document.getElementById('save-status');
            status.innerText = '⏳ جاري الحفظ...';
            setTimeout(() => {
                status.innerText = '● تم الحفظ تلقائياً على جهازك ✓';
            }, 400);
        }

        // عرض التاريخ
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date-display').innerText = new Date().toLocaleDateString('ar-EG', options);

        // --- 1. قائمة المهام ---
        let todos = JSON.parse(localStorage.getItem('user_todos')) || [];
        const todoList = document.getElementById('todo-list');

        function renderTodos() {
            todoList.innerHTML = '';
            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                if (todo.completed) li.classList.add('completed');
                li.innerHTML = `
                    <span onclick="toggleTodo(${index})" style="cursor:pointer; flex:1;">${todo.text}</span>
                    <button class="btn-danger" onclick="deleteTodo(${index})">حذف</button>
                `;
                todoList.appendChild(li);
            });
            localStorage.setItem('user_todos', JSON.stringify(todos));
        }

        function addTodo() {
            const input = document.getElementById('todo-input');
            if (input.value.trim() !== '') {
                todos.push({ text: input.value, completed: false });
                input.value = '';
                renderTodos();
                showSavedStatus();
            }
        }
        function toggleTodo(index) { todos[index].completed = !todos[index].completed; renderTodos(); showSavedStatus(); }
        function deleteTodo(index) { todos.splice(index, 1); renderTodos(); showSavedStatus(); }
        renderTodos();

        // --- 2. المفكرة ---
        const notesArea = document.getElementById('quick-notes');
        notesArea.value = localStorage.getItem('user_notes') || '';
        notesArea.addEventListener('input', () => {
            localStorage.setItem('user_notes', notesArea.value);
            showSavedStatus();
        });

        // --- 3. الروابط المخصصة ---
        let userLinks = JSON.parse(localStorage.getItem('user_links')) || [
            { name: 'ترجمة جوجل', url: 'https://translate.google.com' },
            { name: 'يوتيوب', url: 'https://www.youtube.com' }
        ];
        const linksContainer = document.getElementById('links-container');

        function renderLinks() {
            linksContainer.innerHTML = '';
            userLinks.forEach((link, index) => {
                const div = document.createElement('div');
                div.className = 'link-box';
                div.innerHTML = `
                    <a href="${link.url}" target="_blank">${link.name}</a>
                    <button class="btn-danger" onclick="deleteLink(${index})">×</button>
                `;
                linksContainer.appendChild(div);
            });
            localStorage.setItem('user_links', JSON.stringify(userLinks));
        }

        function addCustomLink() {
            const nameInput = document.getElementById('link-name');
            let urlInput = document.getElementById('link-url').value.trim();
            if (nameInput.value.trim() !== '' && urlInput !== '') {
                if (!urlInput.startsWith('http://') && !urlInput.startsWith('https://')) {
                    urlInput = 'https://' + urlInput;
                }
                userLinks.push({ name: nameInput.value.trim(), url: urlInput });
                nameInput.value = '';
                document.getElementById('link-url').value = '';
                renderLinks();
                showSavedStatus();
            }
        }
        function deleteLink(index) { userLinks.splice(index, 1); renderLinks(); showSavedStatus(); }
        renderLinks();

        // --- 4. البطاقات المخصصة (الميزة الأهم) ---
        let customWidgets = JSON.parse(localStorage.getItem('user_custom_widgets')) || [];
        const mainGrid = document.getElementById('main-grid');

        function renderCustomWidgets() {
            // إزالة البطاقات القديمة قبل إعادة الرسم
            document.querySelectorAll('.custom-widget-card').forEach(el => el.remove());

            customWidgets.forEach((widget, index) => {
                const card = document.createElement('div');
                card.className = 'card custom-widget-card';
                card.innerHTML = `
                    <div class="card-header">
                        <h2>📌 ${widget.title}</h2>
                        <button class="btn-danger" onclick="deleteCustomWidget(${index})">حذف القسم</button>
                    </div>
                    <textarea rows="7" placeholder="اكتب محتوى هذا القسم هنا..." oninput="updateWidgetContent(${index}, this.value)">${widget.content}</textarea>
                `;
                mainGrid.appendChild(card);
            });
            localStorage.setItem('user_custom_widgets', JSON.stringify(customWidgets));
        }

        function createCustomWidget() {
            const title = prompt('اكتب اسم القسم الجديد (مثلاً: مصروفاتي، جدول المذاكرة، أهدافي):');
            if (title && title.trim() !== '') {
                customWidgets.push({ title: title.trim(), content: '' });
                renderCustomWidgets();
                showSavedStatus();
            }
        }

        function updateWidgetContent(index, newText) {
            customWidgets[index].content = newText;
            localStorage.setItem('user_custom_widgets', JSON.stringify(customWidgets));
            showSavedStatus();
        }

        function deleteCustomWidget(index) {
            if (confirm('متأكد إنك عايز تمسح القسم ده؟')) {
                customWidgets.splice(index, 1);
                renderCustomWidgets();
                showSavedStatus();
            }
        }
        renderCustomWidgets();

        // --- 5. المؤقت ---
        let timeLeft = 25 * 60;
        let timerId = null;
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        function startTimer() {
            if (timerId !== null) return;
            timerId = setInterval(() => {
                if (timeLeft > 0) { timeLeft--; updateTimerDisplay(); }
                else { clearInterval(timerId); timerId = null; alert('انتهى وقت التركيز!'); }
            }, 1000);
        }
        function pauseTimer() { clearInterval(timerId); timerId = null; }
        function resetTimer() { pauseTimer(); timeLeft = 25 * 60; updateTimerDisplay(); }

        // --- 6. الآلة الحاسبة ---
        const calcDisplay = document.getElementById('calc-display');
        function appendCalc(val) { calcDisplay.value += val; }
        function clearCalc() { calcDisplay.value = ''; }
        function calculate() {
            try { calcDisplay.value = eval(calcDisplay.value); }
            catch { calcDisplay.value = 'خطأ'; }
        }
    </script>
</body>
  </html>
